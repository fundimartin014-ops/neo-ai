<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Neo Chat</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #e8e8e8; height: 100vh; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { display: flex; gap: 10px; max-width: 85%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai { align-self: flex-start; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #1a1a1a; border: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .msg.user .avatar { background: #ff2d55; border-color: #ff2d55; }
    .bubble { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.6; }
    .msg.user .bubble { background: #ff2d55; color: #fff; border-color: #ff2d55; }
    .tool-card { background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px; margin-top: 8px; }
    .tool-badge { display: inline-block; background: rgba(255,45,85,0.15); color: #ff2d55; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; text-transform: uppercase; }
    .tool-btn { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 10px 14px; color: #e8e8e8; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .tool-btn:hover { border-color: #ff2d55; background: #252525; }
    .tool-btn.active { border-color: #ff2d55; background: rgba(255,45,85,0.1); }
    .iframe-box { margin-top: 10px; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; height: 400px; background: #fff; }
    .iframe-box iframe { width: 100%; height: 100%; border: none; }
    .quick-actions { display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; border-top: 1px solid #2a2a2a; background: #141414; }
    .quick-btn { background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 20px; padding: 6px 14px; color: #e8e8e8; cursor: pointer; font-family: inherit; font-size: 13px; white-space: nowrap; }
    .quick-btn:hover { background: #ff2d55; border-color: #ff2d55; }
    .input-area { display: flex; gap: 10px; padding: 14px 20px 18px; background: #141414; border-top: 1px solid #2a2a2a; }
    .input-field { flex: 1; background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 24px; padding: 12px 18px; color: #e8e8e8; font-family: inherit; font-size: 14px; outline: none; }
    .input-field:focus { border-color: #ff2d55; box-shadow: 0 0 0 3px rgba(255,45,85,0.15); }
    .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #ff2d55; color: #fff; border: none; font-size: 16px; cursor: pointer; }
    .typing { display: flex; gap: 4px; padding: 12px 16px; }
    .typing span { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
  </style>
</head>
<body>
  <div id="messages"></div>
  
  <div class="quick-actions" id="quickActions"></div>
  
  <form class="input-area" id="chatForm">
    <input type="text" class="input-field" id="chatInput" placeholder="Ask Neo anything..." autocomplete="off">
    <button type="submit" class="send-btn">➤</button>
  </form>

  <script>
    const API_URL = ""; // Same origin for Flask
    
    const QUICK_ACTIONS = [
      {label:"🎨 Draw", trigger:"draw a diagram"},
      {label:"📊 JSON", trigger:"visualize json"},
      {label:"🔒 Encode", trigger:"encode decode"},
      {label:"💻 Code", trigger:"code screenshot"},
      {label:"📐 Regex", trigger:"test regex"},
      {label:"🖼️ Image", trigger:"compress image"},
      {label:"📄 PDF", trigger:"edit pdf"},
      {label:"🔄 Convert", trigger:"convert file"},
    ];
    
    // Render quick actions
    document.getElementById("quickActions").innerHTML = QUICK_ACTIONS.map(a => 
      `<button class="quick-btn" onclick="sendMsg('${a.trigger}')">${a.label}</button>`
    ).join("");
    
    function sendMsg(text) {
      if (!text.trim()) return;
      addMsg("user", text);
      document.getElementById("chatInput").value = "";
      setLoading(true);
      
      fetch("/chat", {  // Change to your actual Flask endpoint
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text})
      })
      .then(r => r.json())
      .then(data => {
        setLoading(false);
        addMsg("ai", data.content, data.tool_data);
      })
      .catch(err => {
        setLoading(false);
        addMsg("ai", "Error: " + err.message);
      });
    }
    
    function addMsg(role, content, toolData=null) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      let html = `<div class="avatar">${role==="user"?"🧑":"🤖"}</div>`;
      html += `<div><div class="bubble">${content}</div>`;
      
      if (toolData && toolData.has_tool) {
        html += `<div class="tool-card">
          <div class="tool-badge">🛠️ Tool</div>
          <div style="font-size:13px;color:#888;margin-bottom:10px;">${toolData.description}</div>
          <button class="tool-btn" onclick="embedTool(this,'${toolData.url}','${toolData.name}')">
            Open ${toolData.name} ${toolData.stars ? "⭐ " + (toolData.stars/1000).toFixed(1)+"k" : ""}
          </button>
          <div class="iframe-box" style="display:none;"></div>
        </div>`;
      }
      
      html += `</div>`;
      div.innerHTML = html;
      document.getElementById("messages").appendChild(div);
      document.getElementById("messages").scrollTop = 999999;
    }
    
    function embedTool(btn, url, name) {
      const box = btn.parentElement.querySelector(".iframe-box");
      if (box.style.display === "block") {
        box.style.display = "none"; btn.classList.remove("active");
      } else {
        box.innerHTML = `<iframe src="${url}" sandbox="allow-scripts allow-same-origin allow-forms" loading="lazy"></iframe>`;
        box.style.display = "block"; btn.classList.add("active");
      }
    }
    
    function setLoading(on) {
      const existing = document.querySelector(".typing-msg");
      if (existing) existing.remove();
      if (on) {
        const div = document.createElement("div");
        div.className = "msg ai typing-msg";
        div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
        document.getElementById("messages").appendChild(div);
      }
    }
    
    document.getElementById("chatForm").addEventListener("submit", e => {
      e.preventDefault();
      sendMsg(document.getElementById("chatInput").value);
    });
    
    // Welcome
    addMsg("ai", "Hey! I'm Neo. I can help with coding, diagrams, file conversion, and more. Try typing a task or click a quick action!");
  </script>
</body>
</html>
