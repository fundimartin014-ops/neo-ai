<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiagent</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg:#0f172a; --panel:#1e293b; --border:#334155;
    --fg:#e2e8f0; --dim:#94a3b8; --accent:#38bdf8;
    --ok:#22c55e; --err:#ef4444; --warn:#f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system, system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:960px; margin:32px auto; padding:0 20px; }
  h1 { margin:0 0 4px; font-size:22px; letter-spacing:.5px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }

  /* Tabs */
  .tabbar { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:24px; }
  .tabbar button {
    background:transparent; border:0; color:var(--dim); padding:10px 16px;
    font-size:13px; font-weight:600; letter-spacing:.4px; cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tabbar button:hover { color:var(--fg); }
  .tabbar button.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab-content { display:none; }
  .tab-content.active { display:block; }

  /* Shared input styling */
  input[type=text], input[type=search], textarea {
    width:100%; padding:11px 13px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel); color:var(--fg);
    font-size:14px; outline:none; font-family:inherit;
  }
  input:focus, textarea:focus { border-color:var(--accent); }
  textarea { min-height:70px; resize:vertical; font-family:ui-monospace, "Cascadia Mono", monospace; font-size:12px; }
  button { font-family:inherit; }
  button.primary { padding:11px 20px; border-radius:8px; border:0; background:var(--accent); color:#0b1220; font-weight:600; cursor:pointer; font-size:14px; }
  button.primary:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { padding:8px 14px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--fg); cursor:pointer; font-size:12px; }
  button.ghost:hover { border-color:var(--accent); color:var(--accent); }
  button.danger { color:var(--err); border-color:rgba(239,68,68,0.4); }
  button.danger:hover { border-color:var(--err); color:var(--err); }

  /* Cards */
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); font-weight:600; }
  .empty { color:var(--dim); font-size:13px; font-style:italic; }
  .err { color:var(--err); font-size:13px; }
  .ok { color:var(--ok); }
  .dim { color:var(--dim); font-size:12px; }

  /* Run tab */
  form.run-form { display:flex; gap:8px; margin-bottom:24px; }
  form.run-form input { flex:1; }
  .step { padding:10px 12px; background:rgba(255,255,255,0.03); border-left:3px solid var(--accent); border-radius:4px; margin-bottom:8px; font-size:13px; }
  .step .t { color:var(--accent); font-weight:600; margin-bottom:6px; display:block; }
  .step .r { color:var(--fg); white-space:pre-wrap; word-break:break-word; font-family:ui-monospace, "Cascadia Mono", monospace; font-size:12px; line-height:1.5; max-height:200px; overflow-y:auto; }
  .meta { color:var(--dim); font-size:12px; margin-top:8px; }

  /* Schedules tab */
  .job {
    background:rgba(255,255,255,0.02); border:1px solid var(--border);
    border-radius:8px; padding:14px; margin-bottom:10px;
  }
  .job.off { opacity:.55; }
  .job-top { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .job-name { font-weight:600; font-size:14px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:rgba(56,189,248,0.15); color:var(--accent); letter-spacing:.4px; }
  .badge.off { background:rgba(148,163,184,0.15); color:var(--dim); }
  .job-goal { font-family:ui-monospace, monospace; font-size:11.5px; color:var(--dim); margin:6px 0 10px; line-height:1.4; }
  .job-meta { display:flex; gap:16px; font-size:11px; color:var(--dim); margin-bottom:10px; flex-wrap:wrap; }
  .job-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .job-result { font-family:ui-monospace, monospace; font-size:11px; color:var(--dim); padding:6px 8px; background:rgba(0,0,0,0.2); border-radius:4px; margin-top:8px; max-height:80px; overflow:auto; white-space:pre-wrap; }
  .row { display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .row > * { flex:1; }
  .row > .fixed { flex:0 0 160px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Multiagent</h1>
  <div class="sub">Run goals or schedule recurring jobs.</div>

  <div class="tabbar">
    <button id="tabbtn-run" class="active" data-tab="run">Run Goal</button>
    <button id="tabbtn-schedules" data-tab="schedules">Schedules</button>
  </div>

  <!-- ===================== Run tab ===================== -->
  <div id="tab-run" class="tab-content active">
    <form class="run-form" id="run-form">
      <input id="goal" type="text" placeholder='e.g. "open python.org" or "search for python news, summarize"' autofocus autocomplete="off">
      <button class="primary" id="run-btn" type="submit">Run</button>
    </form>

    <div id="plan-card" class="card" style="display:none">
      <h2>Plan</h2>
      <div id="plan-body"></div>
    </div>

    <div id="results-card" class="card" style="display:none">
      <h2>Results</h2>
      <div id="results-body"></div>
      <div id="meta" class="meta"></div>
    </div>

    <div id="error-card" class="card" style="display:none">
      <h2>Error</h2>
      <div id="error-body" class="err"></div>
    </div>
  </div>

  <!-- ===================== Schedules tab ===================== -->
  <div id="tab-schedules" class="tab-content">
    <div class="card">
      <h2>New Job</h2>
      <form id="job-form">
        <div class="row">
          <input class="fixed" id="job-name" type="text" placeholder="name (e.g. daily-ai-digest)" autocomplete="off">
          <input id="job-schedule" type="text" placeholder="every:5m | hourly | daily@08:00" autocomplete="off">
        </div>
        <textarea id="job-goal" placeholder="Goal text. Supports {{today}}, {{yesterday}}, {{now}}."></textarea>
        <div style="margin-top:10px">
          <button class="primary" id="create-btn" type="submit">Create Job</button>
        </div>
      </form>
      <div id="create-result" class="meta" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>Jobs <span id="jobs-count" class="dim" style="font-weight:400;text-transform:none;letter-spacing:0;margin-left:8px"></span></h2>
      <div id="jobs-list"><div class="empty">Loading...</div></div>
      <div style="margin-top:12px">
        <button class="ghost" id="refresh-btn" type="button">Refresh</button>
      </div>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(iso) {
  if (!iso) return '(never)';
  try {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
    return `${y}-${m}-${day} ${hh}:${mm}`;
  } catch { return iso; }
}

// ---------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------
const tabButtons = document.querySelectorAll('.tabbar button');
tabButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    tabButtons.forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-content').forEach(el => {
      el.classList.toggle('active', el.id === `tab-${tab}`);
    });
    if (tab === 'schedules') loadJobs();
  });
});

// ---------------------------------------------------------------------------
// Run tab
// ---------------------------------------------------------------------------
const runForm   = document.getElementById('run-form');
const goalInput = document.getElementById('goal');
const runBtn    = document.getElementById('run-btn');
const planCard  = document.getElementById('plan-card');
const planBody  = document.getElementById('plan-body');
const resCard   = document.getElementById('results-card');
const resBody   = document.getElementById('results-body');
const meta      = document.getElementById('meta');
const errCard   = document.getElementById('error-card');
const errBody   = document.getElementById('error-body');

runForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const goal = goalInput.value.trim();
  if (!goal) return;

  planCard.style.display = 'none';
  resCard.style.display  = 'none';
  errCard.style.display  = 'none';

  runBtn.disabled = true;
  runBtn.textContent = 'Running...';

  planCard.style.display = 'block';
  planBody.innerHTML = '<div class="empty">Planning...</div>';

  const t0 = performance.now();
  try {
    const res  = await fetch('/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ goal }),
    });
    const data = await res.json();
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);

    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    if (data.error) throw new Error(data.error);

    planBody.innerHTML = (data.plan || []).map((s, i) =>
      `<div class="step"><span class="t">Step ${i+1}</span>${escapeHtml(s)}</div>`
    ).join('') || '<div class="empty">(no steps)</div>';

    resCard.style.display = 'block';
    resBody.innerHTML = (data.results || []).map(r =>
      `<div class="step"><span class="t">${escapeHtml(r.step)}</span><div class="r">${escapeHtml(r.result)}</div></div>`
    ).join('') || '<div class="empty">(no results)</div>';

    meta.textContent = `Completed in ${elapsed}s`;
  } catch (err) {
    errCard.style.display = 'block';
    errBody.textContent = err.message || String(err);
    planCard.style.display = 'none';
    resCard.style.display = 'none';
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = 'Run';
  }
});

// ---------------------------------------------------------------------------
// Schedules tab
// ---------------------------------------------------------------------------
const jobForm       = document.getElementById('job-form');
const jobName       = document.getElementById('job-name');
const jobSchedule   = document.getElementById('job-schedule');
const jobGoal       = document.getElementById('job-goal');
const createBtn     = document.getElementById('create-btn');
const createResult  = document.getElementById('create-result');
const jobsList      = document.getElementById('jobs-list');
const jobsCount     = document.getElementById('jobs-count');
const refreshBtn    = document.getElementById('refresh-btn');

let refreshTimer = null;

async function loadJobs() {
  try {
    const r = await fetch('/schedules/list');
    const jobs = await r.json();
    jobsCount.textContent = `(${jobs.length})`;
    if (!jobs.length) {
      jobsList.innerHTML = '<div class="empty">No jobs yet. Create one above.</div>';
      return;
    }
    jobsList.innerHTML = jobs.map(j => {
      const enabled = !!j.enabled;
      const lastRun = j.last_run ? fmt(j.last_run) : '(never)';
      const nextRun = j.next_run ? fmt(j.next_run) : '-';
      let result = '';
      if (j.last_result) {
        try {
          const parsed = JSON.parse(j.last_result);
          const rs = (parsed.results || []).slice(-1)[0];
          result = rs ? String(rs.result || '').slice(0, 240) : '';
        } catch {
          result = String(j.last_result).slice(0, 240);
        }
      }
      return `
        <div class="job ${enabled ? '' : 'off'}" data-id="${j.id}">
          <div class="job-top">
            <span class="job-name">${escapeHtml(j.name)}</span>
            <span class="badge ${enabled ? '' : 'off'}">${j.schedule}</span>
            <span class="badge ${enabled ? '' : 'off'}">${enabled ? 'ON' : 'OFF'}</span>
            <span class="dim" style="margin-left:auto">#${j.id}</span>
          </div>
          <div class="job-goal">${escapeHtml(j.goal)}</div>
          <div class="job-meta">
            <span>last: ${escapeHtml(lastRun)}</span>
            <span>next: ${escapeHtml(nextRun)}</span>
          </div>
          <div class="job-actions">
            <button class="ghost" data-act="run" data-id="${j.id}">Run now</button>
            <button class="ghost" data-act="toggle" data-id="${j.id}" data-enabled="${enabled ? 0 : 1}">${enabled ? 'Disable' : 'Enable'}</button>
            <button class="ghost danger" data-act="delete" data-id="${j.id}">Delete</button>
          </div>
          ${result ? `<div class="job-result">${result}</div>` : ''}
        </div>`;
    }).join('');
  } catch (err) {
    jobsList.innerHTML = `<div class="err">Failed to load: ${escapeHtml(err.message)}</div>`;
  }
}

jobsList.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  btn.disabled = true;
  try {
    if (act === 'run') {
      btn.textContent = 'Running...';
      await fetch(`/schedules/${id}/run`, { method: 'POST' });
    } else if (act === 'toggle') {
      const enabled = btn.dataset.enabled === '1';
      await fetch(`/schedules/${id}`, {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ enabled }),
      });
    } else if (act === 'delete') {
      if (!confirm(`Delete job #${id}?`)) { btn.disabled = false; return; }
      await fetch(`/schedules/${id}`, { method: 'DELETE' });
    }
    await loadJobs();
  } catch (err) {
    alert('Action failed: ' + err.message);
  } finally {
    btn.disabled = false;
  }
});

jobForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = jobName.value.trim();
  const schedule = jobSchedule.value.trim();
  const goal = jobGoal.value.trim();
  if (!name || !schedule || !goal) {
    createResult.textContent = 'Please fill all three fields.';
    createResult.className = 'meta err';
    return;
  }
  createBtn.disabled = true;
  createBtn.textContent = 'Creating...';
  createResult.textContent = '';
  try {
    const r = await fetch('/schedules', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name, schedule, goal }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'failed');
    createResult.textContent = data.result || 'Created.';
    createResult.className = 'meta ok';
    jobName.value = '';
    jobSchedule.value = '';
    jobGoal.value = '';
    await loadJobs();
  } catch (err) {
    createResult.textContent = 'Error: ' + err.message;
    createResult.className = 'meta err';
  } finally {
    createBtn.disabled = false;
    createBtn.textContent = 'Create Job';
  }
});

refreshBtn.addEventListener('click', loadJobs);

// Auto-refresh while schedules tab is active
setInterval(() => {
  const schedTab = document.getElementById('tab-schedules');
  if (schedTab.classList.contains('active')) loadJobs();
}, 5000);
</script>
</body>
</html>
