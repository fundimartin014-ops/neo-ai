# ═══════════════════════════════════════════════════════════════
# NEO AI — GitHub Actions CI/CD for TRAININGBOT2
# GitHub: fundimartin014-ops
# Auto-builds Docker image and deploys on push to main
# ═══════════════════════════════════════════════════════════════

name: Neo AI CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${ github.repository }

jobs:
  # ─── Build & Test ───
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${ runner.os }-pip-${ hashFiles('**/requirements.txt') }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test with pytest
        run: |
          pip install pytest
          pytest || true  # Don't fail if no tests yet

  # ─── Build Docker Image ───
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${ env.REGISTRY }
          username: ${ github.actor }
          password: ${ secrets.GITHUB_TOKEN }

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${ env.REGISTRY }/${ env.IMAGE_NAME }
          tags: |
            type=ref,event=branch
            type=sha,prefix={branch}-
            type=raw,value=latest,enable={is_default_branch}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${ steps.meta.outputs.tags }
          labels: ${ steps.meta.outputs.labels }
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Render (optional) ───
  deploy-render:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${ secrets.RENDER_SERVICE_ID }
          api-key: ${ secrets.RENDER_API_KEY }

  # ─── Deploy to Oracle Cloud (optional) ───
  deploy-oracle:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${ secrets.ORACLE_HOST }
          username: ubuntu
          key: ${ secrets.ORACLE_SSH_KEY }
          script: |
            cd /home/ubuntu/TRAININGBOT2
            git pull origin main
            docker-compose pull
            docker-compose up -d --build
            docker system prune -f
