services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: multiagent:0.3.0
    container_name: multiagent-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_JSON: "true"
      DB_PATH: "/app/data/agents.db"
      FILE_AGENT_ROOT: "/app/sandbox"
      BUS_BACKEND: "memory"
      API_AGENT_TOKEN: "${API_AGENT_TOKEN:-}"
      API_AGENT_BASE_URL: "${API_AGENT_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
    volumes:
      - ./data:/app/data
      - ./sandbox:/app/sandbox
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s